name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate registry
        run: pnpm registry:validate

      - name: Generate registry
        run: pnpm registry:generate

      - name: Verify signatures
        run: pnpm registry:verify-signatures

      - name: Check Astro site
        run: pnpm site:check

      - name: Build site and registry artifact
        run: pnpm site:build

      - name: Run tests
        run: pnpm test

      - name: Check formatting
        run: pnpm check:format

      - name: Check generated files are committed
        run: git diff --exit-code generated/v1
