name: Publish Registry

on:
  workflow_dispatch:
    inputs:
      approval:
        description: Enter REGISTRY_DEPLOY_APPROVED after the release gate
        required: true

jobs:
  publish:
    if: >-
      vars.FIRST_REGISTRY_RELEASE_APPROVED == 'true' &&
      inputs.approval == 'REGISTRY_DEPLOY_APPROVED'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LAPIS_REGISTRY_KEY_ID: ${{ secrets.LAPIS_REGISTRY_KEY_ID }}
      LAPIS_REGISTRY_PRIVATE_KEY_PEM_B64: ${{ secrets.LAPIS_REGISTRY_PRIVATE_KEY_PEM_B64 }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production registry
        run: pnpm registry:validate:remote

      - name: Generate registry
        run: pnpm registry:generate

      - name: Sign registry
        run: pnpm registry:sign

      - name: Verify signatures
        run: pnpm registry:verify-signatures

      - name: Build site and registry artifact
        run: pnpm site:build

      - name: Deploy site and registry to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name=lapis-plugin-registry --commit-hash="${GITHUB_SHA}"
