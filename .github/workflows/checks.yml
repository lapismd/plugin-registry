name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser acceptance runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate source and published bundles
        run: pnpm registry:validate:remote

      - name: Verify queued plugin submissions
        run: pnpm registry:submissions:verify
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate registry
        run: pnpm registry:generate

      - name: Verify signatures
        run: pnpm registry:verify-signatures

      - name: Validate download statistics
        run: pnpm stats:validate

      - name: Check Astro site
        run: pnpm site:check

      - name: Build site and registry artifact
        run: pnpm site:build

      - name: Run tests
        run: pnpm test

      - name: Run browser acceptance
        run: pnpm test:browser

      - name: Check formatting
        run: pnpm check:format

      - name: Check generated files are committed
        run: git diff --exit-code generated
env:
  LAPIS_CI_EVENT: ${{ github.event_name }}
  LAPIS_CI_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
  LAPIS_CI_PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
  LAPIS_CI_PR_HEAD: ${{ github.event.pull_request.head.ref }}
  LAPIS_DEPENDENCY_BOT_LOGIN: ${{ vars.LAPIS_DEPENDENCY_BOT_LOGIN }}
