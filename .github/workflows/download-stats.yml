name: Publish download statistics

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: plugin-download-statistics
  cancel-in-progress: false

jobs:
  aggregate:
    if: vars.DOWNLOAD_STATS_AUTOMATION_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Create registry GitHub App token
        id: registry-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.LAPIS_REGISTRY_APP_ID }}
          private-key: ${{ secrets.LAPIS_REGISTRY_APP_PRIVATE_KEY }}
          owner: lapismd
          repositories: plugin-registry
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.registry-app.outputs.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read deployed production commit
        id: production
        run: node scripts/read-production-deployment.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Aggregate missing immutable UTC days
        run: pnpm stats:aggregate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          DOWNLOAD_STATS_CUTOVER_DATE: ${{ vars.DOWNLOAD_STATS_CUTOVER_DATE }}

      - name: Validate generated statistics
        run: pnpm stats:validate && node --test scripts/__tests__/download-stats.test.mjs scripts/__tests__/production-deployment.test.mjs

      - name: Commit immutable snapshots
        id: commit
        shell: bash
        run: |
          git add -- stats
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "lapis-registry[bot]"
          git config user.email "lapis-registry[bot]@users.noreply.github.com"
          git commit -m "chore(stats): publish download snapshots"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Check automatic deployment boundary
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        run: node scripts/check-stats-deployment.mjs
        env:
          DEPLOYED_PRODUCTION_COMMIT: ${{ steps.production.outputs.deployed_commit }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build static registry with statistics
        if: steps.deployment.outputs.deploy == 'true'
        run: pnpm site:build

      - name: Deploy statistics-only update
        if: steps.deployment.outputs.deploy == 'true'
        run: >-
          pnpm exec wrangler pages deploy dist
          --project-name=lapis-plugin-registry
          --branch=main
          --commit-hash="$(git rev-parse HEAD)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
