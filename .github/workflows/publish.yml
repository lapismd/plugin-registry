name: Publish registry

on:
  workflow_dispatch:
    inputs:
      approval:
        description: Enter REGISTRY_DEPLOY_APPROVED after the release gate
        required: true

permissions:
  contents: read

jobs:
  publish:
    if: >-
      vars.FIRST_REGISTRY_RELEASE_APPROVED == 'true' &&
      inputs.approval == 'REGISTRY_DEPLOY_APPROVED'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: registry-production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production registry
        run: pnpm registry:validate:remote

      - name: Verify committed registry generation
        run: pnpm registry:generate && git diff --exit-code generated

      - name: Verify release candidate
        run: >-
          pnpm registry:verify-signatures &&
          pnpm stats:validate &&
          pnpm site:check &&
          pnpm site:build &&
          pnpm test &&
          pnpm check:format

      - name: Deploy site and registry to Cloudflare Pages
        run: >-
          pnpm exec wrangler pages deploy dist
          --project-name=lapis-plugin-registry
          --branch=main
          --commit-hash="${GITHUB_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
