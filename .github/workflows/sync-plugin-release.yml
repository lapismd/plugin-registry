name: Sync plugin release

on:
  repository_dispatch:
    types: [plugin_release, plugin_metadata]

permissions: {}

concurrency:
  group: registry-${{ github.event.client_payload.plugin_id }}-${{ github.event.client_payload.version || github.event.client_payload.source_commit }}
  cancel-in-progress: false

jobs:
  sync:
    uses: ./.github/workflows/materialize-registry-pr.yml
    with:
      target: ${{ toJSON(github.event) }}
    secrets: inherit
