name: Publish qualified registry candidate

on:
  workflow_run:
    workflows: [Prepare registry publication]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      preparation_run_id:
        description: Exact successful preparation run whose immutable candidate should resume
        required: true
        type: string
      preparation_run_attempt:
        description: Exact successful preparation attempt
        default: "1"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: registry-publication-writer
  cancel-in-progress: false

env:
  REGISTRY_PRODUCER_RUN_ID: ${{ github.event.workflow_run.id || inputs.preparation_run_id }}
  REGISTRY_PRODUCER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.preparation_run_attempt }}

jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_candidate: ${{ steps.inspect.outputs.has_candidate }}
      artifact_id: ${{ steps.inspect.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
      - id: inspect
        run: node scripts/inspect-publication-producer.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  publish:
    needs: inspect
    if: github.ref == 'refs/heads/main' && needs.inspect.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Create one-repository writer token
        id: registry-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.LAPIS_REGISTRY_APP_CLIENT_ID }}
          private-key: ${{ secrets.LAPIS_REGISTRY_APP_PRIVATE_KEY }}
          owner: lapismd
          repositories: plugin-registry
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.registry-app.outputs.token }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify immutable candidate and publish without rebuilding or signing
        run: node scripts/publish-registry-updates.mjs
        env:
          REGISTRY_PUBLICATION_STAGE: publish
          REGISTRY_CANDIDATE_ARTIFACT_ID: ${{ needs.inspect.outputs.artifact_id }}
          REGISTRY_ARTIFACT_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ steps.registry-app.outputs.token }}
      - name: Retain publication progress and recovery receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: registry-publication-progress-${{ github.run_attempt }}
          path: tmp/publication-report.json
          if-no-files-found: warn
          retention-days: 14
